%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/lg,lge-sbu-mux.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LGE Alpha USB-C SBU mux

maintainers:
  - yuzu <yuzu23234@gmail.com>

description:
  The LGE Alpha boards use GPIO87 to select the SBU routing and GPIO35 to
  select the USB-UART/debug path.  GPIO42 enables the DP AUX switch between
  the SBU pins and the DP controller, and GPIO148 selects its polarity.  Some
  board revisions have an additional output-enable or LDO-enable GPIO.

properties:
  compatible:
    const: lg,lge-sbu-mux

  select-gpios:
    description: GPIO87 SBU routing select.
    maxItems: 1

  uart-sel-gpios:
    description: GPIO35 USB-UART/debug routing select.
    maxItems: 1

  aux-enable-gpios:
    description: GPIO42 DP AUX switch enable.
    maxItems: 1

  aux-select-gpios:
    description: GPIO148 DP AUX switch polarity select. The asserted state
      selects the reversed connector orientation.
    maxItems: 1

  oe-gpios:
    description: Optional SBU switch output-enable GPIO. The logical high
      state disables the switch.
    maxItems: 1

  lg,reverse-sbu-switch:
    description: Invert the SBU select level for this board revision.
    type: boolean

  mode-switch: true
  orientation-switch: true
  pinctrl-names: true
  pinctrl-0: true

  port:
    $ref: /schemas/graph.yaml#/properties/port

required:
  - compatible
  - select-gpios
  - mode-switch
  - orientation-switch
  - port

allOf:
  - $ref: usb-switch.yaml#
  - $ref: usb-switch-ports.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    sbu-mux {
        compatible = "lg,lge-sbu-mux";
        select-gpios = <&tlmm 87 GPIO_ACTIVE_HIGH>;
        uart-sel-gpios = <&tlmm 35 GPIO_ACTIVE_HIGH>;
        aux-enable-gpios = <&tlmm 42 GPIO_ACTIVE_LOW>;
        aux-select-gpios = <&tlmm 148 GPIO_ACTIVE_HIGH>;
        mode-switch;
        orientation-switch;

        port {
            sbu_mux_in: endpoint {
                remote-endpoint = <&typec_sbu_out>;
            };
        };
    };
