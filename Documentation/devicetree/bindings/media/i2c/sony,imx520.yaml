%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx520.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX520 Image Sensor

description:
  The Sony IMX520 is an 8 megapixel CMOS image sensor that outputs RAW10
  image data over a two-lane MIPI CSI-2 interface.

maintainers:
  - Linux Media Mailing List <linux-media@vger.kernel.org>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#
  - $ref: /schemas/nvmem/nvmem-consumer.yaml#

properties:
  compatible:
    const: sony,imx520

  reg:
    maxItems: 1

  clocks:
    description: Sensor input clock.
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to the XCLR pin.
    maxItems: 1

  mclk-request-gpios:
    description: GPIO requesting the shared camera clock path.
    maxItems: 1

  lg,camera-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: LG camera profile identifier used by the module calibration.

  vdda-supply:
    description: Analogue power supply, 2.8 volts.

  vddd-supply:
    description: Digital core power supply, 1.05 volts.

  vddio-supply:
    description: Digital I/O power supply, 1.8 volts.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

        required:
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vdda-supply
  - vddd-supply
  - vddio-supply
  - port

unevaluatedProperties: false

examples:
  - |
      #include <dt-bindings/gpio/gpio.h>

      i2c {
          #address-cells = <1>;
          #size-cells = <0>;

          camera@10 {
              compatible = "sony,imx520";
              reg = <0x10>;
              clocks = <&camera_clk>;
              reset-gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
              vdda-supply = <&camera_vdda>;
              vddd-supply = <&camera_vddd>;
              vddio-supply = <&camera_vddio>;

              port {
                  imx520_ep: endpoint {
                      link-frequencies = /bits/ 64 <716800000 675200000>;
                      remote-endpoint = <&csi_ep>;
                      data-lanes = <1 2>;
                  };
              };
          };
      };
...
