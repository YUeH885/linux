%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B SMB5 charger and Gen4 fuel gauge

maintainers:
  - Yuzu <yuzu23234@gmail.com>

description: |
  PM8150B 集成 SMB5 charger 和 Gen4 fuel gauge。驱动保留 bootloader
  写入的电池温度阈值，并通过标准 battery 和 usb power_supply 暴露遥测。

properties:
  compatible:
    const: qcom,pm8150b-charger

  reg:
    maxItems: 1

  interrupts:
    maxItems: 6

  interrupt-names:
    items:
      - const: chg-state-change
      - const: bat-temp
      - const: usbin-plugin
      - const: wdog-bark
      - const: soc-update
      - const: batt-temp-delta

  io-channels:
    items:
      - description: USB 输入电流检测值
      - description: USB 输入电压

  io-channel-names:
    items:
      - const: usbin_i
      - const: usbin_v

  monitored-battery: true

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery

allOf:
  - $ref: power-supply.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      #address-cells = <1>;
      #size-cells = <0>;

      charger@1000 {
        compatible = "qcom,pm8150b-charger";
        reg = <0x1000>;
        interrupts = <0x2 0x10 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x12 0x0 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x13 0x4 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x16 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x40 0x0 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x42 0x2 IRQ_TYPE_EDGE_BOTH>;
        interrupt-names = "chg-state-change", "bat-temp", "usbin-plugin",
                          "wdog-bark", "soc-update", "batt-temp-delta";
        io-channels = <&pm8150b_adc 7>, <&pm8150b_adc 8>;
        io-channel-names = "usbin_i", "usbin_v";
        monitored-battery = <&battery>;
        wakeup-source;
      };
    };
