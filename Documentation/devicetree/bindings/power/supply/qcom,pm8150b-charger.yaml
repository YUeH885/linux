%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B SMB5 charger and Gen4 fuel gauge

maintainers:
  - Yuzu <yuzu23234@gmail.com>

description: |
  PM8150B integrates an SMB5 charger and a Gen4 fuel gauge. The driver keeps the
  battery temperature thresholds programmed by the bootloader and exposes
  telemetry through the standard battery and usb power supplies.

properties:
  compatible:
    const: qcom,pm8150b-charger

  reg:
    maxItems: 1

  interrupts:
    maxItems: 10

  interrupt-names:
    items:
      - const: chg-state-change
      - const: bat-temp
      - const: usbin-plugin
      - const: usbin-src-change
      - const: wdog-bark
      - const: soc-update
      - const: batt-temp-delta
      - const: usbin-uv
      - const: temp-change
      - const: usbin-icl-change

  io-channels:
    items:
      - description: USB input current sense
      - description: MID_CHG voltage on the USB input path

  io-channel-names:
    items:
      - const: usbin_i
      - const: mid_chg

  monitored-battery: true

  qcom,parallel-charger:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: power supply of the SMB1355 parallel charger

  qcom,parallel-percent:
    minimum: 1
    maximum: 99
    description:
      Target share of the fast charge current, in percent, assigned to the
      parallel charger at normal battery temperature.

  qcom,auto-recharge-soc:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 100
    description:
      State of charge, in percent, at which SOC-based recharge restarts
      charging.

  qcom,wd-bark-time-secs:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [16, 32, 64, 128]
    description:
      Watchdog bark timeout in seconds.

  qcom,wd-snarl-time-config:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 7
    description:
      Factory watchdog snarl timeout selector.

  qcom,hw-die-temp-mitigation:
    type: boolean
    description:
      Enable the charger die-temperature monitor and comparator. Temperature
      monitoring sources are disabled unless enabled by the corresponding
      mitigation property.

  qcom,hw-connector-mitigation:
    type: boolean
    description:
      Enable the connector-thermistor temperature monitor.

  qcom,hw-skin-temp-mitigation:
    type: boolean
    description:
      Enable the skin-thermistor temperature monitor.

  qcom,usb-c-port:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      TCPM port providing the USB Type-C and USB Power Delivery negotiation
      result.

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery
  - qcom,parallel-charger
  - qcom,parallel-percent
  - qcom,auto-recharge-soc
  - qcom,usb-c-port

allOf:
  - $ref: power-supply.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      #address-cells = <1>;
      #size-cells = <0>;

      pm8150b_typec: typec {
      };

      charger@1000 {
        compatible = "qcom,pm8150b-charger";
        reg = <0x1000>;
        interrupts = <0x2 0x10 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x12 0x0 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x13 0x4 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x13 0x6 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x16 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x40 0x0 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x42 0x2 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x13 0x2 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x16 0x6 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x13 0x7 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "chg-state-change", "bat-temp", "usbin-plugin",
                          "usbin-src-change", "wdog-bark", "soc-update",
                          "batt-temp-delta", "usbin-uv", "temp-change",
                          "usbin-icl-change";
        io-channels = <&pm8150b_adc 7>, <&pm8150b_adc 30>;
        io-channel-names = "usbin_i", "mid_chg";
        monitored-battery = <&battery>;
        qcom,hw-die-temp-mitigation;
        qcom,parallel-charger = <&smb1355>;
        qcom,parallel-percent = <70>;
        qcom,auto-recharge-soc = <98>;
        qcom,usb-c-port = <&pm8150b_typec>;
        wakeup-source;
      };
    };
