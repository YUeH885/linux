%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/lg,sw43410.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LG SW43410 AMOLED DDIC

maintainers:
  - Yuzu <yuzu23234@gmail.com>

description:
  SW43410 是带 DSC 支持的 AMOLED 面板显示驱动 IC。

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: lg,sw43410

  reg:
    maxItems: 1

  port: true
  vddi-supply: true
  vpnl-supply: true
  reset-gpios: true

required:
  - compatible
  - reg
  - port
  - vddi-supply
  - vpnl-supply
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "lg,sw43410";
            reg = <0>;

            vddi-supply = <&vreg_l14a_1p8>;
            vpnl-supply = <&vreg_l17a_3p0>;
            reset-gpios = <&tlmm 6 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
