%YAML 1.2
---
$id: http://devicetree.org/schemas/pps/pps-irq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PPS Signal via an Interrupt Controller

maintainers:
  - yuzu <yuzu23234@gmail.com>

description:
  A PPS signal routed to an interrupt controller. The selected interrupt edge
  is reported as a PPS assert event. Pin multiplexing is configured separately
  from interrupt delivery.

properties:
  compatible:
    const: pps-irq

  interrupts:
    maxItems: 1

required:
  - compatible
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pps {
        compatible = "pps-irq";
        interrupt-parent = <&pdc>;
        interrupts = <60 IRQ_TYPE_EDGE_RISING>;
    };
