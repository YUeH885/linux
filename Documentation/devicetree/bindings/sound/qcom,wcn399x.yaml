%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,wcn399x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm WCN399x SLIMbus voice audio interface

maintainers:
  - yuzu <yuzu23234@gmail.com>

description:
  The WCN399x Bluetooth controller exposes a SLIMbus interface device at
  device index 0 and a ported audio device at device index 1. SCO audio
  uses port 0 for capture and port 16 for playback.

properties:
  compatible:
    const: slim217,220

  reg:
    items:
      - items:
          - enum: [0, 1]
          - const: 0

  slim-ifc-dev:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SLIMbus interface device used to configure audio ports.

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        reg:
          items:
            - items:
                - const: 1
    then:
      required:
        - slim-ifc-dev
        - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    slim {
        #address-cells = <2>;
        #size-cells = <0>;

        wcn399x_ifd: ifd@0,0 {
            compatible = "slim217,220";
            reg = <0 0>;
        };

        codec@1,0 {
            compatible = "slim217,220";
            reg = <1 0>;
            slim-ifc-dev = <&wcn399x_ifd>;
            #sound-dai-cells = <0>;
        };
    };
