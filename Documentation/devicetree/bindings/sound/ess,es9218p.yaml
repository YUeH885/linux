%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/ess,es9218p.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ESS ES9218P stereo DAC and headphone amplifier

maintainers:
  - Yuzu <yuzu23234@gmail.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: ess,es9218p

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  power-gpios:
    maxItems: 1
    description: External power switch, active high.

  mode-gpios:
    maxItems: 1
    description: Mode selection; high with reset asserted selects bypass.

  reset-gpios:
    maxItems: 1
    description: Reset release signal, high to run the DAC.

  ess,use-internal-ldo:
    type: boolean
    description: Use the internal digital supply regulator.

required:
  - compatible
  - reg
  - '#sound-dai-cells'
  - power-gpios
  - mode-gpios
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        dac@48 {
            compatible = "ess,es9218p";
            reg = <0x48>;
            #sound-dai-cells = <0>;
            power-gpios = <&gpio 10 GPIO_ACTIVE_HIGH>;
            mode-gpios = <&gpio 9 GPIO_ACTIVE_HIGH>;
            reset-gpios = <&gpio 24 GPIO_ACTIVE_HIGH>;
            ess,use-internal-ldo;
        };
    };
