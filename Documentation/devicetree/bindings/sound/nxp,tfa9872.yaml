%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nxp,tfa9872.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP TFA9872 smart amplifier with Qualcomm TFADSP

maintainers:
  - Yuzu <yuzu23234@gmail.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: nxp,tfa9872

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  qcom,q6afe:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: AFE service providing the secondary MI2S TFADSP interface.

  firmware-name:
    maxItems: 1
    description: TFA parameter container for this amplifier and speaker.

required:
  - compatible
  - reg
  - '#sound-dai-cells'
  - qcom,q6afe
  - firmware-name

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        amplifier@34 {
            compatible = "nxp,tfa9872";
            reg = <0x34>;
            #sound-dai-cells = <0>;
            qcom,q6afe = <&q6afe>;
            firmware-name = "Tfa9872.cnt";
        };
    };
